<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{

            background:linear-gradient(
                135deg,
                #1e3c72,
                #2a5298
            );

            min-height:100vh;

            padding:40px;

            color:white;
        }

        h1{

            margin-bottom:30px;
        }

        .dashboard{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(250px,1fr));

            gap:25px;
        }

        .card{

            background:rgba(255,255,255,0.1);

            padding:30px;

            border-radius:20px;

            backdrop-filter:blur(10px);

            box-shadow:0px 4px 20px rgba(0,0,0,0.2);
        }

        .card h2{

            font-size:20px;

            margin-bottom:15px;
        }

        .number{

            font-size:40px;

            font-weight:bold;

            color:#00e676;
        }

        table{

            width:100%;

            margin-top:20px;

            border-collapse:collapse;
        }

        th, td{

            padding:15px;

            text-align:left;

            border-bottom:
            1px solid rgba(255,255,255,0.2);
        }

        th{

            background:rgba(255,255,255,0.1);
        }

        .table-card{

            margin-top:30px;
        }

        a{

            color:white;

            text-decoration:none;

            display:inline-block;

            margin-top:20px;
        }

    </style>

</head>

<body>

    <h1>Admin Dashboard</h1>

    <div class="dashboard">

        <div class="card">

            <h2>Total Users</h2>

            <div class="number">
                {{ total_users }}
            </div>

        </div>

        <div class="card">

            <h2>Total Analyses</h2>

            <div class="number">
                {{ total_analyses }}
            </div>

        </div>

        <div class="card">

            <h2>Average ATS Score</h2>

            <div class="number">
                {{ average_score }}%
            </div>

        </div>

    </div>

    <div class="card table-card">

        <h2>Recent Resume Analyses</h2>

        <table>

            <tr>

                <th>Resume</th>

                <th>ATS Score</th>

            </tr>

            {% for analysis in recent_analyses %}

            <tr>

                <td>
                    {{ analysis.filename }}
                </td>

                <td>
                    {{ analysis.ats_score }}%
                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

    <a href="/">
        ← Back to Home
    </a>

</body>

</html>

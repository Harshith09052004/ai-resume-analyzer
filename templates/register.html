<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
        }

        .card{
            width:400px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0px 4px 20px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        input{
            width:100%;
            padding:15px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            background:#f1f1f1;
        }

        button{
            width:100%;
            padding:15px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:#0072ff;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#0056d2;
        }

        a{
            display:block;
            margin-top:20px;
            text-align:center;
            text-decoration:none;
            color:#0072ff;
        }

    </style>

</head>
<body>

    <div class="card">

        <h1>Create Account</h1>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <a href="/login">
            Already have an account?
        </a>

    </div>

</body>
</html>
